<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <title> Spring Boot </title>
    <link rel="stylesheet" href="/css/styles.css"/>
</head>
<body>
<h3> Login with username and password </h3>

<form action="#" th:action="@{/app/login}" method="post" class="form-horizontal" style="width: 100%">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <div class="form-group">
        <label for="username" class="col-sm-2 control-label">User : </label>
        <div class="col-sm-10">
            <input type="text" id="username" name="username" placeholder="Username" class="col-4">
            <p class="text-danger"></p>
        </div>
    </div>
    <div class="form-group">
        <label for="password" class="col-sm-2 control-label">Password : </label>
        <div class="col-sm-10">
            <input type="password" id="password" name="password" placeholder="Password" class="col-4">
            <p class="text-danger" ></p>
        </div>
    </div>

    <div class="form-group">
        <div class="col-sm-12">
            <button type="submit" class="btn btn-primary">Login</button>
        </div>
    </div>
</form>
</body>
</html>
